[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repopilot-agent"
version = "0.3.0"
description = "Evidence-grounded repository engineering agent with a local dashboard and MCP tools"
requires-python = ">=3.10"

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9"]
mcp = ["mcp>=1.0"]
dev = ["pytest>=7.0", "httpx>=0.24"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project.scripts]
repopilot = "repopilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
repopilot = ["web/*.html"]
